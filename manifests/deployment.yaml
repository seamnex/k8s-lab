apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: demo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Nunca menos de 2 pods sirviendo durante un deploy:
      # esto es lo que convierte una actualización en un no-evento
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      # Techo para el apagado: tiene que ser mayor que el sleep del preStop
      # (10s) mas lo que tarde nginx en cerrar. Si el preStop lo excede,
      # kubelet manda SIGKILL igual y perdes la ventana que querias ganar.
      terminationGracePeriodSeconds: 30
      containers:
        - name: demo-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          # El fix del experimento 2. Cuando un pod entra en Terminating,
          # kubelet arranca el apagado y el endpoint-controller lo saca del
          # Service EN PARALELO, no en orden. Durante esa ventana kube-proxy
          # sigue mandando trafico a un nginx que ya cerro el listener: eso
          # son los codigos 000 (conexion rechazada), no 5xx.
          # El sleep no hace nada util salvo lo unico que importa: retrasar
          # el SIGTERM hasta que la baja del Service ya se propago.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # readiness: ¿puede recibir tráfico?
          # Si falla, se saca del Service pero NO se reinicia.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # liveness: ¿está vivo?
          # Si falla, kubelet mata el contenedor y lo reinicia.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
